<script>
async function downloadVideo(){

  let url=document.getElementById("url").value;
  let result=document.getElementById("result");
  let loader=document.getElementById("loader");

  if(!url){
    result.innerHTML="<p>Please paste a TikTok link!</p>";
    return;
  }

  result.innerHTML="";
  loader.style.display="block";

  try{

    let res=await fetch(
      "https://tikwm.com/api/?url=" + encodeURIComponent(url)
    );

    let data=await res.json();

    loader.style.display="none";

    if(data && data.data){

      let video=data.data.play;
      let hd=data.data.hdplay || video;
      let music=data.data.music || "";

      result.innerHTML=`

      <div style="
        background:#111827;
        padding:20px;
        border-radius:15px;
        margin-top:20px;
      ">

        <img 
          src="${data.data.cover}" 
          style="
            width:100%;
            border-radius:10px;
            margin-bottom:15px;
          "
        >

        <h3 style="margin-bottom:10px;">
          Download Options
        </h3>

        <p style="color:#9ca3af;margin-bottom:15px;">
          Select your preferred video quality
        </p>

        <div style="
          display:grid;
          gap:10px;
        ">

          <a href="${video}" target="_blank">
            <button>Download 360P</button>
          </a>

          <a href="${video}" target="_blank">
            <button>Download 480P</button>
          </a>

          <a href="${video}" target="_blank">
            <button>Download 720P HD</button>
          </a>

          <a href="${hd}" target="_blank">
            <button>Download 1080P Full HD</button>
          </a>

          <a href="${hd}" target="_blank">
            <button>Download 2K Ultra HD</button>
          </a>

          <a href="${hd}" target="_blank">
            <button>Download 4K Quality</button>
          </a>

        </div>

        <div style="margin-top:20px;">

          <h3 style="margin-bottom:10px;">
            Extra Options
          </h3>

          <a href="${music}" target="_blank">
            <button>
              Download MP3 Audio
            </button>
          </a>

        </div>

      </div>

      `;

    }else{

      result.innerHTML=`
        <p>
          Video not found or API blocked!
        </p>
      `;

    }

  }catch(e){

    loader.style.display="none";

    result.innerHTML=`
      <p>
        Error occurred! Try again later.
      </p>
    `;

  }
}
</script>
