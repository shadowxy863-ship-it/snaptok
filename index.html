<script>

async function downloadVideo() {

  const url = document.getElementById("url").value.trim();

  const result = document.getElementById("result");

  const loader = document.getElementById("loader");

  if (!url) {

    result.innerHTML = `
      <p style="color:#f87171;">
        Please paste a TikTok video link.
      </p>
    `;

    return;
  }

  loader.style.display = "block";

  result.innerHTML = "";

  try {

    const response = await fetch(
      "https://tikwm.com/api/?url=" + encodeURIComponent(url)
    );

    const json = await response.json();

    loader.style.display = "none";

    if (!json || !json.data) {

      result.innerHTML = `
        <p style="color:#f87171;">
          Failed to fetch video data.
        </p>
      `;

      return;
    }

    const data = json.data;

    const title = data.title || "TikTok Video";

    const cover = data.cover || "";

    const normalVideo = data.play || "";

    const hdVideo = data.hdplay || data.play || "";

    const music = data.music || "";

    result.innerHTML = `

      <div class="result-card">

        <img 
          src="${cover}" 
          alt="Thumbnail"
        >

        <h3 style="
          margin-bottom:10px;
          font-size:20px;
        ">
          ${title}
        </h3>

        <p style="
          color:#94a3b8;
          margin-bottom:20px;
        ">
          Select your preferred quality
        </p>

        <div class="download-grid">

          <a 
            class="download-btn"
            href="${normalVideo}"
            target="_blank"
            download
          >
            <button>
              Download Standard Quality
            </button>
          </a>

          <a 
            class="download-btn"
            href="${hdVideo}"
            target="_blank"
            download
          >
            <button>
              Download HD Quality
            </button>
          </a>

          <a 
            class="download-btn"
            href="${music}"
            target="_blank"
            download
          >
            <button>
              Download MP3 Audio
            </button>
          </a>

        </div>

        <div style="
          margin-top:20px;
          background:#0f172a;
          padding:15px;
          border-radius:10px;
          color:#cbd5e1;
          font-size:14px;
        ">

          <strong>Quality Notice:</strong>

          <br><br>

          TikTok videos only support the qualities
          available in the original upload.

          <br><br>

          HD quality will appear automatically
          when supported by the video.

        </div>

      </div>

    `;

  } catch (error) {

    loader.style.display = "none";

    result.innerHTML = `
      <p style="color:#f87171;">
        Something went wrong. Please try again later.
      </p>
    `;

    console.error(error);

  }

}

</script>
