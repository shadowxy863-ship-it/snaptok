<script>

async function downloadVideo(){

const url = document.getElementById("url").value.trim();
const result = document.getElementById("result");

if(!url){
result.innerHTML = "";
return;
}

result.innerHTML = "<p style='color:#cbd5e1'>Loading...</p>";

let json;

try{

const res = await fetch(
"https://tikwm.com/api/?url=" + encodeURIComponent(url)
);

json = await res.json();

}catch(e){

json = null;

}

const data = json && json.data;

if(!data){

// silent fallback (NO ERROR TEXT)
result.innerHTML = `
<div class="card">
<p style="color:#cbd5e1">
Video not available right now.
</p>
</div>
`;
return;

}

const video = data.play || "";
const hd = data.hdplay || video || "";
const music = data.music || "";
const title = data.title || "TikTok Video";

result.innerHTML = `
<div class="card">

<h3>${title}</h3>

<div class="downloads">

<a href="${video}" target="_blank">
<button>Download Standard</button>
</a>

<a href="${hd}" target="_blank">
<button>Download HD</button>
</a>

<a href="${music}" target="_blank">
<button>Download MP3</button>
</a>

</div>

</div>
`;

}

</script>
